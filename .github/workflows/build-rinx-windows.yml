name: Build RINX Battle Royale Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'PUBG-Offline/**'
      - '.github/workflows/build-rinx-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: PUBG-Offline
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Build Windows package
        working-directory: PUBG-Offline
        shell: pwsh
        run: npm run build:win

      - name: Verify package
        working-directory: PUBG-Offline
        shell: pwsh
        run: |
          if (-not (Test-Path dist)) { throw 'Build output directory missing' }
          $files = Get-ChildItem dist -Recurse -File
          if ($files.Count -eq 0) { throw 'No build output produced' }
          $files | Select-Object FullName,Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RINX-Battle-Royale-Windows
          path: PUBG-Offline/dist/**
          if-no-files-found: error
          retention-days: 30
