name: Update CISA KEV

on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: write

jobs:
  kev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch CISA Known Exploited Vulnerabilities
        run: |
          set -euo pipefail
          curl -fsSL 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json' -o /tmp/kev.json
      - name: Build compact feed
        run: |
          python - <<'PY'
          import json, datetime
          from pathlib import Path
          raw=json.loads(Path('/tmp/kev.json').read_text())
          vulns=raw.get('vulnerabilities', [])
          vulns=sorted(vulns, key=lambda x: x.get('dateAdded',''), reverse=True)[:20]
          out={
            'source':'CISA KEV',
            'catalogVersion':raw.get('catalogVersion'),
            'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'vulnerabilities':vulns
          }
          p=Path('docs/data/kev.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/kev.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update CISA KEV feed'
          git push
